# Local development database only — never deployed.
# Prod uses the shared Postgres instance (schema `drumgen`); this throwaway
# instance keeps local work off any real DB. Port 55432 avoids clashing with a
# system Postgres or another project's local DB.
services:
  db-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drumgen
      POSTGRES_PASSWORD: drumgen
      POSTGRES_DB: drumgen
    ports:
      - "55432:5432"
    volumes:
      - drumgen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drumgen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drumgen_pgdata:
